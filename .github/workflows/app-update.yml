name: app-update

on:
  push:
    branches: [main]
    paths: ["frontend/apps/ruta/**", "frontend/packages/**"]
    tags: ["v*"]

jobs:
  eas-update:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend/apps/ruta } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm -C ../.. install --frozen-lockfile
      # RN-APP-10: main → canal preview (pruebas); solo un tag v* (versión aprobada al cierre de sprint) publica a
      # production. Se aplica al abrir la app (RN-APP-08) y solo llega a los APK con la misma versión (runtimeVersion).
      - name: Publicar a preview
        if: github.ref_type == 'branch'
        run: eas update --channel preview --message "${{ github.event.head_commit.message }}" --non-interactive
      - name: Publicar a production
        if: github.ref_type == 'tag'
        run: eas update --channel production --message "${{ github.ref_name }}" --non-interactive
