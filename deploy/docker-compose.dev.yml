# Infraestructura local de desarrollo: PostgreSQL 16 (+ pgAdmin opcional con --profile admin).
name: tortillas-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tortillas
      POSTGRES_USER: tg
      POSTGRES_PASSWORD: tg
      TZ: UTC
    ports:
      - "${TG_PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tg -d tortillas"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:8
    profiles: ["admin"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tortillas.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
